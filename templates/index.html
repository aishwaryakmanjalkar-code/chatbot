<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ college_name }} - Admissions Chatbot</title>

  <!-- Bootstrap CSS (CDN) - only styling used, no custom CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🎓 {{ college_name }} - Admissions Chatbot</span>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="card shadow">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <span>Chat with our Admissions Assistant</span>
            <button id="resetBtn" class="btn btn-sm btn-outline-light">Reset Chat</button>
          </div>

          <div class="card-body" style="height: 500px; overflow-y: auto;" id="chatBox">
            <div class="d-flex mb-3">
              <div class="bg-secondary bg-opacity-10 border rounded p-3">
                👋 Hi! I'm the BCA Admissions Assistant for KLE BCA College, Belagavi.
                Ask me about eligibility, fees, documents, admission process, dates, or placements.
              </div>
            </div>
          </div>

          <div class="card-footer bg-white">
            <form id="chatForm" class="d-flex gap-2">
              <input
                type="text"
                id="userInput"
                class="form-control"
                placeholder="Type your question here..."
                autocomplete="off"
                required
              >
              <button type="submit" class="btn btn-primary" id="sendBtn">Send</button>
            </form>
          </div>
        </div>

        <div class="text-center text-muted small mt-3">
          Powered by Ollama (llama3.2:latest) &middot; Flask &middot; Bootstrap
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (CDN) - only script used, no custom JS files -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');

    function appendMessage(text, sender) {
      const wrapper = document.createElement('div');
      wrapper.className = 'd-flex mb-3 ' + (sender === 'user' ? 'justify-content-end' : '');

      const bubble = document.createElement('div');
      bubble.className = sender === 'user'
        ? 'bg-primary text-white rounded p-3'
        : 'bg-secondary bg-opacity-10 border rounded p-3';
      bubble.style.maxWidth = '80%';
      bubble.innerText = text;

      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendTypingIndicator() {
      const wrapper = document.createElement('div');
      wrapper.className = 'd-flex mb-3';
      wrapper.id = 'typingIndicator';

      const bubble = document.createElement('div');
      bubble.className = 'bg-secondary bg-opacity-10 border rounded p-3';
      bubble.innerHTML = `
        <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
        Typing...
      `;

      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    chatForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage(message, 'user');
      userInput.value = '';
      sendBtn.disabled = true;
      appendTypingIndicator();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });
        const data = await res.json();
        removeTypingIndicator();
        appendMessage(data.reply, 'bot');
      } catch (err) {
        removeTypingIndicator();
        appendMessage('⚠️ Something went wrong. Please try again.', 'bot');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });

    resetBtn.addEventListener('click', async function () {
      await fetch('/reset', { method: 'POST' });
      chatBox.innerHTML = '';
      appendMessage("👋 Chat reset. Ask me anything about KLE BCA College admissions!", 'bot');
    });
  </script>

</body>
</html>
